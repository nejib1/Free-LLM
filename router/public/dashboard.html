<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Free-LLM Router</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%2306b6d4'/%3E%3Cstop offset='1' stop-color='%234f46e5'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='9' fill='url(%23g)'/%3E%3Cpath d='M18 5 9 18h6l-2 9 10-14h-6z' fill='white'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#f6f7f9;--panel:#fff;--panel2:#f3f4f7;--hover:#f0f2f6;--text:#0d1424;--text2:#344054;--muted:#667085;--line:#e6e8ee;--line2:#d9dce4;
  --accent:#4f46e5;--accent2:#06b6d4;--accentsoft:#eef0ff;--ok:#12a150;--oksoft:#e8f7ee;--warn:#c47a06;--warnsoft:#fdf4e3;--bad:#d92d20;--badsoft:#fdecea;
  --shadow:0 1px 2px rgba(16,24,40,.05);--shadow2:0 1px 3px rgba(16,24,40,.06),0 8px 24px -12px rgba(16,24,40,.12);
  --code:#0f1729;--codetext:#e2e8f0;--r:12px;--mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0a0d14;--panel:#10141d;--panel2:#161b26;--hover:#181e2a;--text:#eef1f6;--text2:#c6ccd8;--muted:#8a93a6;--line:#1f2633;--line2:#2a3242;--accentsoft:#1c1f3d;--oksoft:#0f2a1c;--warnsoft:#2b2210;--badsoft:#2d1414;--shadow:none;--shadow2:0 8px 28px -14px rgba(0,0,0,.6);--code:#0b0f17;--accent:#7c74ff}}
:root[data-theme=dark]{--bg:#0a0d14;--panel:#10141d;--panel2:#161b26;--hover:#181e2a;--text:#eef1f6;--text2:#c6ccd8;--muted:#8a93a6;--line:#1f2633;--line2:#2a3242;--accentsoft:#1c1f3d;--oksoft:#0f2a1c;--warnsoft:#2b2210;--badsoft:#2d1414;--shadow:none;--shadow2:0 8px 28px -14px rgba(0,0,0,.6);--code:#0b0f17;--accent:#7c74ff}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:14.5px/1.55 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
a{color:var(--accent);text-decoration:none}a:hover{text-decoration:underline}
button,input,select,textarea{font:inherit;color:inherit}
svg.i{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.app{display:grid;grid-template-columns:252px minmax(0,1fr);min-height:100vh}

/* sidebar */
nav{background:var(--panel);border-right:1px solid var(--line);padding:18px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:2px;overflow-y:auto}
.logo{display:flex;align-items:center;gap:11px;padding:2px 8px 18px}
.logo .mark{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--accent2),var(--accent));display:grid;place-items:center;color:#fff;box-shadow:0 6px 16px -6px color-mix(in srgb,var(--accent) 70%,transparent)}
.logo .mark svg{width:18px;height:18px;fill:#fff;stroke:none}
.logo b{display:block;font-size:15px;letter-spacing:-.01em}.logo small{display:block;color:var(--muted);font-size:12px;margin-top:-2px}
.navlabel{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);padding:14px 10px 6px}
nav a.nl{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:9px;color:var(--text2);font-weight:550;position:relative}
nav a.nl:hover{background:var(--hover);text-decoration:none}
nav a.nl.on{background:var(--accentsoft);color:var(--accent)}
nav a.nl.on:before{content:"";position:absolute;left:-14px;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0;background:var(--accent)}
nav .count{margin-left:auto;font-size:11px;font-weight:700;background:var(--panel2);color:var(--muted);border-radius:99px;padding:1px 7px}
nav a.nl.on .count{background:var(--panel);color:var(--accent)}
nav .sp{flex:1;min-height:16px}
.status{border:1px solid var(--line);border-radius:12px;padding:11px 12px;background:var(--panel2);font-size:12.5px}
.status .top{display:flex;align-items:center;gap:8px;font-weight:650;color:var(--text)}
.status .addr{color:var(--muted);font-family:var(--mono);font-size:11.5px;margin-top:3px;word-break:break-all}
.pulse{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 0 color-mix(in srgb,var(--ok) 60%,transparent);animation:pulse 2s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 7px transparent}100%{box-shadow:0 0 0 0 transparent}}
.navfoot{display:flex;gap:6px;margin-top:10px}
.iconbtn{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--panel);color:var(--text2);cursor:pointer}
.iconbtn:hover{background:var(--hover);text-decoration:none}
.navfoot .grow{display:flex;align-items:center;gap:7px;padding:0 10px;border:1px solid var(--line);border-radius:9px;color:var(--text2);font-weight:550;font-size:13px}
.navfoot .grow:hover{background:var(--hover);text-decoration:none}

/* layout */
main{padding:30px clamp(16px,3.4vw,44px) 60px;max-width:1200px;width:100%;min-width:0}
.ph{display:flex;align-items:flex-end;gap:16px;justify-content:space-between;flex-wrap:wrap;margin-bottom:22px}
.ph h1{font-size:24px;line-height:1.25;margin:0;letter-spacing:-.02em}.ph p{color:var(--muted);margin:5px 0 0;max-width:720px}
h2{font-size:15.5px;margin:0;letter-spacing:-.01em}h3{font-size:14.5px;margin:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.cb{padding:18px 20px}.ch{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:15px 20px;border-bottom:1px solid var(--line)}
.ch p{margin:2px 0 0;color:var(--muted);font-size:13px}
.grid{display:grid;gap:16px}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g32{grid-template-columns:minmax(0,3fr) minmax(0,2fr)}
.mt{margin-top:16px}.mb{margin-bottom:16px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.row>*{min-width:0}.grow{flex:1}
.muted{color:var(--muted)}.small{font-size:13px}.xs{font-size:12px}.hide{display:none!important}
code,.mono{font-family:var(--mono);font-size:12.5px}
:not(pre)>code{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:1px 6px}

/* controls */
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line2);background:var(--panel);border-radius:9px;padding:8px 14px;cursor:pointer;font-weight:600;font-size:13.5px;color:var(--text);white-space:nowrap;box-shadow:var(--shadow);transition:background .15s,border-color .15s}
.btn:hover{background:var(--hover);text-decoration:none}
.btn.p{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 1px 2px rgba(16,24,40,.08),0 4px 12px -4px color-mix(in srgb,var(--accent) 55%,transparent)}
.btn.p:hover{filter:brightness(1.08)}
.btn.s{padding:5px 10px;font-size:12.5px;border-radius:8px}.btn.d{color:var(--bad)}.btn.ghost{border-color:transparent;box-shadow:none;background:transparent}.btn.ghost:hover{background:var(--hover)}
.btn[disabled]{opacity:.6;cursor:default}
input[type=text],input[type=password],input[type=number],select,textarea{background:var(--panel);border:1px solid var(--line2);border-radius:9px;padding:8px 12px;width:100%;transition:border-color .15s,box-shadow .15s}
input::placeholder,textarea::placeholder{color:color-mix(in srgb,var(--muted) 80%,transparent)}
textarea{font-family:var(--mono);font-size:12.5px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 18%,transparent)}
.search{position:relative}.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted)}.search input{padding-left:34px}
.field{display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel2);border-radius:9px;padding:4px 4px 4px 12px}
.field code{flex:1;background:none;border:0;padding:0;font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin:0 0 5px;text-transform:uppercase;letter-spacing:.05em}
.switch{display:flex;align-items:flex-start;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);cursor:pointer}.switch:last-of-type{border-bottom:0}
.switch input{appearance:none;flex:none;width:36px;height:20px;border-radius:99px;background:var(--line2);position:relative;cursor:pointer;margin:1px 0 0;transition:background .15s}
.switch input:after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2);transition:left .15s}
.switch input:checked{background:var(--accent)}.switch input:checked:after{left:18px}
.switch b{display:block;font-weight:600;font-size:13.5px}.switch span{color:var(--muted);font-size:12.5px}
.numrow{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid var(--line)}.numrow:last-child{border:0}.numrow input{width:84px;text-align:right}

/* chips, dots */
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;padding:2px 8px;border-radius:99px;background:var(--panel2);color:var(--text2);font-weight:600;white-space:nowrap;border:1px solid var(--line)}
.chip.ok{background:var(--oksoft);color:var(--ok);border-color:transparent}.chip.warn{background:var(--warnsoft);color:var(--warn);border-color:transparent}.chip.bad{background:var(--badsoft);color:var(--bad);border-color:transparent}.chip.ac{background:var(--accentsoft);color:var(--accent);border-color:transparent}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;background:var(--line2);flex:none}.dot.ok{background:var(--ok)}.dot.warn{background:var(--warn)}.dot.bad{background:var(--bad)}

/* home */
.hero{position:relative;overflow:hidden;border-radius:16px;border:1px solid var(--line);background:var(--panel);box-shadow:var(--shadow2)}
.hero:before{content:"";position:absolute;inset:0;background:radial-gradient(600px 220px at 0% 0%,color-mix(in srgb,var(--accent2) 14%,transparent),transparent 70%),radial-gradient(500px 240px at 100% 0%,color-mix(in srgb,var(--accent) 14%,transparent),transparent 70%);pointer-events:none}
.hero .in{position:relative;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:28px;padding:24px 26px}
.hero h2{font-size:20px;letter-spacing:-.02em;margin:10px 0 6px}.hero p{color:var(--text2);margin:0}
.live{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:650;color:var(--ok);background:var(--oksoft);padding:3px 10px;border-radius:99px}
.conn{display:grid;gap:10px;min-width:0}.conn>div{min-width:0}.field{min-width:0}
.kpi{padding:16px 18px;display:flex;gap:14px;align-items:flex-start}
.kpi .ic{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:var(--accentsoft);color:var(--accent);flex:none}
.kpi .ic svg{width:18px;height:18px}
.kpi b{display:block;font-size:22px;line-height:1.2;letter-spacing:-.02em}.kpi span{color:var(--muted);font-size:12.5px}
.check{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);align-items:flex-start}.check:last-child{border:0;padding-bottom:0}
.check .n{width:24px;height:24px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:12px;font-weight:700;border:1.5px solid var(--line2);color:var(--muted)}
.check.done .n{background:var(--ok);border-color:var(--ok);color:#fff}.check.done b{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--line2)}
.check b{display:block;font-size:13.5px}.check span{color:var(--muted);font-size:12.5px}
.how{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.how div{padding:14px;border:1px solid var(--line);border-radius:11px;background:var(--panel2)}
.how i{font-style:normal;display:inline-grid;place-items:center;width:22px;height:22px;border-radius:7px;background:var(--accent);color:#fff;font-size:12px;font-weight:700;margin-bottom:8px}
.how p{margin:0;font-size:13px;color:var(--text2)}
.svgchart{width:100%;height:150px;display:block}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:8px}

/* keys */
.trust{display:flex;gap:12px;align-items:flex-start;padding:13px 16px;border-radius:12px;border:1px solid color-mix(in srgb,var(--ok) 28%,var(--line));background:color-mix(in srgb,var(--ok) 6%,var(--panel));margin-bottom:16px}
.trust>svg{color:var(--ok);width:20px;height:20px;margin-top:1px}
.trust b{color:var(--text)}.trust p{margin:0;color:var(--text2);font-size:13px}
.trust details{margin-top:4px;font-size:13px}.trust summary{cursor:pointer;color:var(--ok);font-weight:600}.trust ul{margin:8px 0 0;padding-left:18px;color:var(--text2)}.trust li{margin:3px 0}
.prov{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;padding:16px 20px;border-bottom:1px solid var(--line)}.prov:last-child{border:0}
.av{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;font-weight:750;font-size:14px;color:#fff;flex:none}
.prov h3{display:flex;align-items:center;gap:7px;flex-wrap:wrap}.prov .meta{margin:2px 0 0;color:var(--muted);font-size:12.5px}
.keyline{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:8px;font-size:12.5px;padding:7px 10px;border:1px solid var(--line);border-radius:9px;background:var(--panel2)}
.keyrow{display:flex;gap:8px;margin-top:10px}.keyrow input{flex:1}
.acts{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.sec{font-size:12px;font-weight:650;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:22px 0 8px}

/* connect */
.tool{display:flex;flex-direction:column}.tool .ch{border:0;padding-bottom:6px}
pre{background:var(--code);color:var(--codetext);border-radius:10px;padding:14px 16px;overflow:auto;font-size:12.5px;margin:0;white-space:pre-wrap;word-break:break-word;line-height:1.6}
.copy{position:relative;margin:0 20px 18px}.copy pre{padding-top:44px}.copy .btn{position:absolute;top:8px;right:8px;background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.14);color:#e2e8f0;box-shadow:none}
.copy .btn:hover{background:rgba(255,255,255,.16)}
.cmd{display:flex;align-items:center;gap:10px;background:var(--code);color:var(--codetext);border-radius:10px;padding:10px 10px 10px 14px;font-family:var(--mono);font-size:13px}
.cmd span{flex:1;overflow:auto;white-space:nowrap}.cmd .btn{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.14);color:#e2e8f0;box-shadow:none}

/* tables */
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;color:var(--muted);font-weight:600;font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--panel2);white-space:nowrap}
td{padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:middle}tr:last-child td{border-bottom:0}tbody tr:hover td{background:color-mix(in srgb,var(--hover) 60%,transparent)}
.bar{height:6px;border-radius:9px;background:var(--panel2);overflow:hidden;width:90px;border:1px solid var(--line)}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent2),var(--accent))}
.empty{padding:34px 20px;text-align:center;color:var(--muted)}.empty svg{width:28px;height:28px;color:var(--line2);margin-bottom:6px}

/* chat */
.chatwrap{display:flex;flex-direction:column;height:calc(100vh - 190px);min-height:420px}
.chat{flex:1;overflow:auto;padding:20px}
.msg{display:flex;gap:10px;margin:0 0 16px;max-width:860px}.msg .bub{white-space:pre-wrap;padding:10px 14px;border-radius:14px;line-height:1.6;min-width:0;word-wrap:break-word}
.msg.u{margin-left:auto;flex-direction:row-reverse}.msg.u .bub{background:var(--accent);color:#fff;border-bottom-right-radius:4px}
.msg.a .bub{background:var(--panel2);border:1px solid var(--line);border-bottom-left-radius:4px}
.msg .who{width:28px;height:28px;border-radius:8px;flex:none;display:grid;place-items:center;background:linear-gradient(135deg,var(--accent2),var(--accent));color:#fff}.msg .who svg{width:14px;height:14px;fill:#fff;stroke:none}
.msg.u .who{background:var(--panel2);color:var(--muted);border:1px solid var(--line)}
.msg small{display:flex;gap:6px;align-items:center;color:var(--muted);font-size:11.5px;margin-top:6px}
.composer{border-top:1px solid var(--line);padding:12px;display:flex;gap:10px;align-items:flex-end}
.composer textarea{font-family:inherit;font-size:14.5px;min-height:44px;max-height:180px}
.sugg{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:14px}
.sugg button{border:1px solid var(--line2);background:var(--panel);border-radius:99px;padding:6px 13px;font-size:13px;cursor:pointer;color:var(--text2)}.sugg button:hover{border-color:var(--accent);color:var(--accent)}

/* settings */
.opts{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.opt{border:1px solid var(--line2);border-radius:11px;padding:12px 14px;cursor:pointer;display:block;transition:border-color .15s,background .15s;position:relative}
.opt:hover{border-color:var(--accent)}.opt:has(input:checked){border-color:var(--accent);background:var(--accentsoft);box-shadow:0 0 0 1px var(--accent) inset}
.opt input{position:absolute;opacity:0}.opt b{font-size:13.5px}.opt p{margin:3px 0 0;color:var(--muted);font-size:12.5px}
.savebar{position:sticky;bottom:0;margin-top:18px;padding:12px 0;background:linear-gradient(to top,var(--bg) 70%,transparent);display:flex;gap:10px;align-items:center}

/* misc */
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(8px);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;font-size:13.5px;opacity:0;transition:.2s;pointer-events:none;z-index:9;box-shadow:0 10px 30px -10px rgba(0,0,0,.4)}.toast.on{opacity:1;transform:translateX(-50%)}
.loginwrap{min-height:70vh;display:grid;place-items:center}.login{width:min(440px,100%);padding:28px}
.skel{height:14px;border-radius:6px;background:linear-gradient(90deg,var(--panel2),var(--hover),var(--panel2));background-size:200% 100%;animation:sk 1.2s infinite}@keyframes sk{to{background-position:-200% 0}}
@media (max-width:1150px){.opts{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:1050px){.hero .in{grid-template-columns:minmax(0,1fr)}.g32{grid-template-columns:minmax(0,1fr)}}
@media (max-width:640px){.opts{grid-template-columns:minmax(0,1fr)}.field .xs{display:none}.hero .in{padding:20px 18px}}
@media (max-width:900px){.app{grid-template-columns:minmax(0,1fr)}nav{position:sticky;z-index:5;height:auto;flex-direction:row;align-items:center;overflow-x:auto;padding:8px 10px;border-right:0;border-bottom:1px solid var(--line);gap:4px}
  nav .logo{padding:0 8px 0 2px}nav .logo div,nav .navlabel,nav .sp,nav .status,nav .navfoot .grow{display:none}nav a.nl{white-space:nowrap}nav a.nl.on:before{display:none}nav .navfoot{margin:0}
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3,.g2,.how{grid-template-columns:minmax(0,1fr)}.prov{grid-template-columns:auto minmax(0,1fr)}.prov .acts{grid-column:1/-1;flex-direction:row;align-items:center;justify-content:flex-start}.chatwrap{height:70vh}}
</style>
</head>
<body>
<div class="app">
<nav>
  <div class="logo"><span class="mark"><svg viewBox="0 0 24 24"><path d="M13.5 2 4 14h7l-1.5 8L19 10h-7z"/></svg></span><div><b>Free-LLM Router</b><small>Runs on this computer</small></div></div>
  <div class="navlabel">Get started</div>
  <a class="nl" href="#home" data-p="home" data-i="home">Overview</a>
  <a class="nl" href="#keys" data-p="keys" data-i="key">Free keys<span class="count hide" id="nkeys"></span></a>
  <a class="nl" href="#connect" data-p="connect" data-i="plug">Connect your tools</a>
  <div class="navlabel">Use</div>
  <a class="nl" href="#playground" data-p="playground" data-i="chat">Playground</a>
  <a class="nl" href="#models" data-p="models" data-i="layers">Models<span class="count hide" id="nmodels"></span></a>
  <a class="nl" href="#activity" data-p="activity" data-i="activity">Activity</a>

const fmt = (n) => Number(n || 0).toLocaleString();
const ms = (v) => v == null ? '—' : v < 1000 ? Math.round(v) + ' ms' : (v / 1000).toFixed(1) + ' s';
const ago = (t) => { const s = Math.round((Date.now() - new Date(t).getTime()) / 1000); return s < 60 ? s + 's ago' : s < 3600 ? Math.round(s / 60) + ' min ago' : s < 86400 ? Math.round(s / 3600) + ' h ago' : Math.round(s / 86400) + ' d ago'; };

try { KEY = KEY || localStorage.getItem('fllm_key'); } catch {}

const I = (n, cls = '') => `<svg class="i ${cls}" viewBox="0 0 24 24" aria-hidden="true">${ICONS[n] || ''}</svg>`;
const BOLT = '<svg viewBox="0 0 24 24"><path d="M13.5 2 4 14h7l-1.5 8L19 10h-7z"/></svg>';
document.querySelectorAll('[data-i]').forEach((el) => el.insertAdjacentHTML('afterbegin', I(el.dataset.i)));

function toast(t) { const el = $('#toast'); el.textContent = t; el.classList.add('on'); clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove('on'), 2400); }
async function api(path, opts = {}) {
  const r = await fetch(path, { ...opts, headers: { authorization: 'Bearer ' + KEY, 'content-type': 'application/json', ...(opts.headers || {}) }, body: opts.body ? JSON.stringify(opts.body) : undefined });
  if (r.status === 401) { login(); throw new Error('unauthorized'); }
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error?.message || j.error || 'HTTP ' + r.status);
  return j;
}
function copyText(t) { navigator.clipboard?.writeText(t).then(() => toast('Copied to clipboard'), () => toast('Select and copy manually')); }
document.addEventListener('click', (e) => {
  const c = e.target.closest('[data-copy]');
  if (c) { e.preventDefault(); copyText(c.dataset.copy); }
});
const header = (title, sub, actions = '') => `<div class="ph"><div><h1>${title}</h1>${sub ? `<p>${sub}</p>` : ''}</div>${actions ? `<div class="row">${actions}</div>` : ''}</div>`;
const copyBtn = (v, label = 'Copy') => `<button type="button" class="btn s" data-copy="${esc(v)}">${I('copy')}${label}</button>`;
const avatar = (name) => {
  let h = 0; for (const ch of String(name)) h = (h * 31 + ch.charCodeAt(0)) % 360;
  const ini = String(name).replace(/[^A-Za-z0-9 ]/g, '').split(/\s+/).filter(Boolean).slice(0, 2).map((w) => w[0]).join('').toUpperCase() || '?';
  return `<span class="av" style="background:linear-gradient(135deg,hsl(${h} 70% 52%),hsl(${(h + 40) % 360} 70% 42%))">${esc(ini)}</span>`;
};

// theme
(function () {
  let t = null; try { t = localStorage.getItem('fllm_theme'); } catch {}
  if (t) document.documentElement.dataset.theme = t;
  const isDark = () => (document.documentElement.dataset.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')) === 'dark';
  const paint = () => { $('#theme').innerHTML = I(isDark() ? 'sun' : 'moon'); };
  paint();
  $('#theme').onclick = (e) => {
    e.preventDefault();
    const next = isDark() ? 'light' : 'dark';
    document.documentElement.dataset.theme = next;
    try { localStorage.setItem('fllm_theme', next); } catch {}
    paint();
  };
})();

function login() {
  $('#navstatus').classList.add('hide');
  $('#main').innerHTML = `<div class="loginwrap"><div class="card login">
    <div class="logo" style="padding:0 0 18px"><span class="mark">${BOLT}</span><div><b>Unlock the dashboard</b><small>Free-LLM Router v${esc(BOOT.version)}</small></div></div>
    <p class="muted small" style="margin:0 0 16px">This dashboard needs the router key: you opened it from another device, or the key was changed. It is printed when the router starts, and stored in <code>~/.free-llm/config.json</code>.</p>
    <label class="label" for="k">Router key</label>
    <div class="row"><input type="password" id="k" class="grow" placeholder="fllm-…" autocomplete="off"><button class="btn p" id="go">Open</button></div></div></div>`;
  const go = () => { KEY = $('#k').value.trim(); try { localStorage.setItem('fllm_key', KEY); } catch {} $('#navstatus').classList.remove('hide'); route(); };
  $('#go').onclick = go;
  $('#k').onkeydown = (e) => { if (e.key === 'Enter') go(); };
  $('#k').focus();
}

function navInfo(s) {
  if (!s) return;
  $('#navaddr').textContent = (s.root_url || '').replace(/^https?:\/\//, '') + ' · v' + s.version;
  const nk = $('#nkeys'), nm = $('#nmodels');
  nk.textContent = s.providers_with_keys; nk.classList.toggle('hide', !s.providers_with_keys);
  nm.textContent = s.models; nm.classList.toggle('hide', !s.models);
}

// ---------------- pages ----------------
const pages = {};
let STATUS = null;
let timer = null;

pages.home = async () => {
  const [s, stats] = await Promise.all([api('/admin/api/status'), api('/admin/api/stats?days=7')]);
  STATUS = s; navInfo(s);
  const t = s.today;
  const rate = t.requests ? Math.round((t.ok / t.requests) * 100) : null;
  const total7 = (stats.days || []).reduce((a, d) => a + (d.requests || 0), 0);
  const steps = [
    [s.providers_with_keys > 0, 'Add a free key', 'Gemini, Groq or OpenRouter take a minute, no card needed.', '#keys', 'Add a key'],
    [total7 > 0, 'Send a first message', 'Check that everything answers, right here in the browser.', '#playground', 'Open the playground'],
    [total7 > 2, 'Connect your tools', 'Claude Code, Codex, Cursor, Open WebUI… one command or a copy-paste.', '#connect', 'See recipes'],
  ];
  const doneAll = steps.every((x) => x[0]);
  const masked = s.api_key ? s.api_key.slice(0, 9) + '••••••••••••' + s.api_key.slice(-4) : '';
  $('#main').innerHTML = `
    ${header('Overview', '')}
    <div class="hero mb"><div class="in">
      <div>
        <span class="live"><span class="pulse"></span> Running · v${esc(s.version)}</span>
        <h2>All your free AI models, behind one address</h2>
        <p>Point any app or coding agent at the router. It sends each request to a free model that is up right now, and switches instantly when a provider is busy or out of quota.</p>
        <div class="row mt">
          <a class="btn p" href="#connect">${I('plug')}Connect a tool</a>
          <a class="btn" href="#playground">${I('chat')}Try it</a>
        </div>
        <p class="xs muted" style="margin-top:14px;display:flex;gap:6px;align-items:center">${I('shield')} Runs on this computer. Keys and conversations never go through free-llm.com.</p>
      </div>
      <div class="conn">
        <div><span class="label">Base URL (OpenAI-compatible)</span><div class="field"><code>${esc(s.base_url)}</code>${copyBtn(s.base_url)}</div></div>
        <div><span class="label">Router key <span style="text-transform:none;letter-spacing:0;font-weight:500">· created for you, nothing to sign up for</span></span><div class="field"><code id="apikey" data-full="${esc(s.api_key)}" data-shown="">${esc(masked)}</code><button class="btn s ghost" id="reveal" title="Show / hide">${I('eye')}</button>${copyBtn(s.api_key)}</div></div>
        <div><span class="label">Model</span><div class="field"><code>auto</code><span class="xs muted" style="padding-right:8px">or auto:coding · auto:fast · auto:smart</span></div></div>
      </div>
    </div></div>
    ${s.guest_mode || !s.providers_with_keys ? `<div class="trust" ${s.guest_mode ? '' : 'style="border-color:color-mix(in srgb,var(--warn) 35%,var(--line));background:color-mix(in srgb,var(--warn) 7%,var(--panel))"'}>${I(s.guest_mode ? 'check' : 'key')}<div class="grow"><b>${s.guest_mode ? 'It already works, with no key at all' : 'One step left: add a free key'}</b>
      <p>${s.guest_mode ? 'You are in guest mode: a few no-account models answer right now. Want it faster? Add 2–3 free keys (a minute each, most without a card) to unlock dozens of strong models.' : 'The router needs at least one provider key before it can answer. Most take a minute and need no card.'}</p></div><a class="btn ${s.guest_mode ? '' : 'p'}" href="#keys">${s.guest_mode ? 'Make it faster' : 'Add a key'}</a></div>` : ''}
    <div class="grid g4 mb">
      <div class="card kpi"><span class="ic">${I('layers')}</span><div><b>${fmt(s.models)}</b><span>free models ready</span></div></div>
      <div class="card kpi"><span class="ic">${I('key')}</span><div><b>${fmt(s.providers_with_keys)}</b><span>providers connected</span></div></div>
      <div class="card kpi"><span class="ic">${I('activity')}</span><div><b>${fmt(t.requests)}</b><span>requests today${rate != null ? ` · ${rate}% first try` : ''}</span></div></div>
      <div class="card kpi"><span class="ic">${I('coins')}</span><div><b>${fmt(t.tokens)}</b><span>free tokens today</span></div></div>

      <div class="card"><div class="ch"><div><h2>Last 7 days</h2><p>${fmt(total7)} requests</p></div><a class="btn s" href="#activity">View activity</a></div><div class="cb">${chart(stats.days)}</div></div>
      ${doneAll ? '' : `<div class="card"><div class="ch"><div><h2>Get set up</h2><p>${steps.filter((x) => x[0]).length} of 3 done</p></div></div><div class="cb" style="padding-top:6px">
        ${steps.map(([done, title, text, href, cta], i) => `<div class="check ${done ? 'done' : ''}"><span class="n">${done ? I('check') : i + 1}</span><div class="grow"><b>${title}</b><span>${text}</span></div>${done ? '' : `<a class="btn s" href="${href}">${cta}</a>`}</div>`).join('')}
      </div></div>`}
    </div>
    <div class="card mt"><div class="ch"><h2>How it works</h2></div><div class="cb"><div class="how">
      <div><i>1</i><p>Your app sends a normal <b>OpenAI or Anthropic</b> request to one local address.</p></div>
      <div><i>2</i><p>The router picks the best <b>free model that is up right now</b>: speed, quality and quota left.</p></div>
      <div><i>3</i><p>If that provider is busy or out of quota, it <b>switches instantly</b>. Your app never sees the error.</p></div>
    </div></div></div>
    <p class="xs muted" style="margin-top:14px">Catalog: ${fmt(s.catalog.providers)} providers · ${fmt(s.catalog.models)} models · from ${esc(s.catalog.source)} · updated ${s.catalog.loaded_at ? ago(s.catalog.loaded_at) : '—'}</p>`;
  $('#reveal').onclick = () => { const k = $('#apikey'); const show = !k.dataset.shown; k.dataset.shown = show ? '1' : ''; k.textContent = show ? k.dataset.full : masked; };
};

function chart(raw) {
  // always 7 slots, oldest → today
  const byDay = Object.fromEntries((raw || []).map((d) => [d.day, d]));
  const days = Array.from({ length: 7 }, (_, i) => {
    const k = new Date(Date.now() - (6 - i) * 864e5).toISOString().slice(0, 10);
    return byDay[k] || { day: k, requests: 0, fail: 0 };
  });
  if (!days.some((d) => d.requests)) return `<div class="empty">${I('activity')}<div>No requests yet. Send one from the playground or connect a tool.</div></div>`;
  const max = Math.max(...days.map((d) => d.requests), 1);
  const w = 100 / days.length;
  const grid = [25, 50, 75].map((y) => `<line x1="0" x2="100%" y1="${y}%" y2="${y}%" stroke="var(--line)" stroke-dasharray="3 4"></line>`).join('');
  const bars = days.map((d, i) => {
    const h = Math.max((d.requests / max) * 92, d.requests ? 2 : 0);
    const hf = (d.fail / max) * 92;
    return `<g><title>${esc(d.day)}: ${d.requests} requests (${d.fail} switched)</title>
      <rect x="${i * w + w * 0.26}%" y="${100 - h}%" width="${w * 0.48}%" height="${h}%" rx="4" fill="var(--accent)" opacity=".9"></rect>
      ${hf ? `<rect x="${i * w + w * 0.26}%" y="${100 - hf}%" width="${w * 0.48}%" height="${hf}%" rx="4" fill="var(--warn)"></rect>` : ''}</g>`;
  }).join('');
  const wd = (k) => new Date(k + 'T12:00:00Z').toLocaleDateString('en-US', { weekday: 'short', day: 'numeric' });
  const labels = days.map((d) => `<span style="width:${w}%;text-align:center">${esc(wd(d.day))}<br><b style="color:var(--text2)">${d.requests || ''}</b></span>`).join('');
  return `<svg class="svgchart" preserveAspectRatio="none">${grid}${bars}</svg><div class="row muted xs" style="gap:0;margin-top:6px;line-height:1.4">${labels}</div>
    <div class="legend"><span class="row" style="gap:6px"><span class="dot" style="background:var(--accent)"></span>requests</span><span class="row" style="gap:6px"><span class="dot warn"></span>switched to another provider</span></div>`;
}

const TRUST = `<div class="trust">${I('shield')}<div class="grow"><b>100% local: your keys never leave this computer</b>
  <p>Stored encrypted here, sent only to the provider that issued them. No account, no telemetry.</p>
  <details><summary>How your keys are protected</summary><ul>
  <li><b>Stored only here</b>, encrypted (AES-256-GCM) in <code>~/.free-llm</code>. Not on free-llm.com, not in any cloud.</li>
  <li><b>Each key goes only to its own provider</b> (your Groq key only to <code>api.groq.com</code>) and is locked to that address: if it ever changed, the router would refuse to send it.</li>
  <li><b>No telemetry, no analytics.</b> The only other download is the public list of free models; nothing about you is sent.</li>
  <li><b>Open source</b>: every line is on <a href="https://github.com/nejib1/Free-LLM/tree/main/router" target="_blank" rel="noopener">GitHub</a>.</li></ul></details></div></div>`;
const SIGNUP = { no: ['ok', 'No card'], registration: ['', 'Email sign-up'], phone_verification: ['warn', 'Phone check'], credit_card: ['bad', 'Card required'] };
let provFilter = '';
let showAll = false;
pages.keys = async () => {
  const { providers } = await api('/admin/api/providers');
  const usable = providers.filter((p) => p.usable && p.chat_models > 0);
  usable.sort((a, b) => (b.keys.length > 0) - (a.keys.length > 0) || b.score - a.score);
  const mine = usable.filter((p) => p.keys.length);
  const list = usable.filter((p) => (!provFilter || (p.name + p.slug).toLowerCase().includes(provFilter)));
  const conn = list.filter((p) => p.keys.length);
  const rest = list.filter((p) => !p.keys.length);
  const restShown = showAll || provFilter ? rest : rest.slice(0, Math.max(10, 18 - conn.length));
  $('#nkeys').textContent = mine.length; $('#nkeys').classList.toggle('hide', !mine.length);
  $('#main').innerHTML = `
    ${header('Free keys', 'Each key unlocks more free models. Get a key from the provider (usually a minute), paste it here: it is tested right away.', `<span class="chip ok">${mine.length} connected</span><span class="chip">${usable.length} providers</span>`)}
    ${TRUST}
    <div class="search mb">${I('search')}<input type="text" id="pf" placeholder="Search a provider: Gemini, Groq, OpenRouter…" value="${esc(provFilter)}"></div>
    ${conn.length ? `<div class="sec">Connected</div><div class="card">${conn.map(provRow).join('')}</div>` : ''}
    ${rest.length ? `<div class="sec">${conn.length ? 'Add more providers' : 'Recommended providers'}</div><div class="card">${restShown.map(provRow).join('')}
      ${restShown.length < rest.length ? `<div style="text-align:center;padding:14px"><button class="btn" id="more">Show all ${rest.length} providers</button></div>` : ''}</div>` : ''}
    ${!list.length ? `<div class="card empty">${I('search')}<div>No provider matches “${esc(provFilter)}”.</div></div>` : ''}`;
  $('#pf').oninput = (e) => { provFilter = e.target.value.toLowerCase(); clearTimeout(window._pf); window._pf = setTimeout(() => pages.keys().then(() => { const i = $('#pf'); i.focus(); i.setSelectionRange(i.value.length, i.value.length); }), 250); };
  if ($('#more')) $('#more').onclick = () => { showAll = true; pages.keys(); };
  document.querySelectorAll('[data-add]').forEach((b) => b.onclick = () => addKey(b.dataset.add));
  document.querySelectorAll('input[id^="key-"]').forEach((inp) => inp.onkeydown = (e) => { if (e.key === 'Enter') addKey(inp.id.slice(4)); });
  document.querySelectorAll('[data-del]').forEach((b) => b.onclick = async () => { if (!confirm('Remove this key?')) return; await api('/admin/api/keys', { method: 'DELETE', body: { provider: b.dataset.p, id: b.dataset.del } }); toast('Key removed'); pages.keys(); });
  document.querySelectorAll('[data-test]').forEach((b) => b.onclick = async () => { b.disabled = true; b.innerHTML = I('refresh') + 'Testing…'; const r = await api('/admin/api/keys/test', { method: 'POST', body: { provider: b.dataset.test } }); toast(r.results.every((x) => x.ok) ? 'The key works' : 'Problem: ' + (r.results.find((x) => !x.ok)?.error || '')); pages.keys(); });
  document.querySelectorAll('[data-guest]').forEach((b) => b.onclick = async () => { await api('/admin/api/providers/toggle', { method: 'POST', body: { provider: b.dataset.guest, guest: b.dataset.on !== '1' } }); pages.keys(); });
};
function provRow(p) {
  const [cls, label] = SIGNUP[p.signup] || ['', p.signup || ''];
  const keys = p.keys.map((k) => `<div class="keyline"><span class="dot ${k.invalid ? 'bad' : 'ok'}"></span><code>${esc(k.masked)}</code>
    ${k.invalid ? `<span class="chip bad">${esc(k.invalid)}</span>` : `<span class="muted">active · sent only to <code>${esc(k.sent_to || '')}</code></span>`}
    ${k.rate?.remaining_requests != null ? `<span class="muted">· ${fmt(k.rate.remaining_requests)} requests left in window</span>` : ''}

async function addKey(slug) {
  const key = $('#key-' + CSS.escape(slug)).value.trim();
  const acc = $('#acc-' + CSS.escape(slug))?.value.trim();
  if (!key && !acc) return toast('Paste the key first');
  toast('Saving and testing…');
  try {
    const r = await api('/admin/api/keys', { method: 'POST', body: { provider: slug, key, account_id: acc || undefined } });
    toast(!r.test ? 'Saved' : r.test.ok ? `It works (${ms(r.test.ms)}): models unlocked` : 'Saved, but the test failed: ' + r.test.error);
  } catch (e) { toast(e.message); }
  pages.keys();

let chatHistory = [];
const SUGG = ['Explain what an API rate limit is, in two sentences', 'Write a Python function that checks if a string is a palindrome', 'Give me three name ideas for a coffee shop'];
pages.playground = async () => {
  const models = await api('/v1/models');
  const opts = models.data.map((m) => `<option value="${esc(m.id)}">${esc(m.id)}${m.description ? ' — ' + esc(m.description) : ''}</option>`).join('');
  $('#main').innerHTML = `
    ${header('Playground', 'Chat through the router. Each answer shows which free model replied, and whether the router had to switch.',
      `<select id="model" style="width:auto;max-width:340px">${opts}</select><button class="btn" id="clear">${I('plus')}New chat</button>`)}
    <div class="card chatwrap">
      <div class="chat" id="chat"></div>
      <div class="composer"><textarea id="q" rows="1" class="grow" placeholder="Message the router…  (Enter to send, Shift+Enter for a new line)"></textarea><button class="btn p" id="send">${I('send')}Send</button></div>
    </div>`;
  renderChat();
  $('#clear').onclick = () => { chatHistory = []; renderChat(); };
  $('#send').onclick = send;
  const q = $('#q');
  q.onkeydown = (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); } };
  q.oninput = () => { q.style.height = 'auto'; q.style.height = Math.min(q.scrollHeight, 180) + 'px'; };
  q.focus();
};
function renderChat() {
  const el = $('#chat');
  if (!el) return;
  if (!chatHistory.length) {
    el.innerHTML = `<div class="empty" style="padding-top:12vh"><div class="logo" style="justify-content:center;padding:0 0 10px"><span class="mark">${BOLT}</span></div>
      <h2 style="color:var(--text)">Ask anything</h2><p class="small" style="margin:4px 0 0">Tip: pick <code>auto:fusion</code> to get one answer merged from three different models.</p>
      <div class="sugg">${SUGG.map((s) => `<button data-s="${esc(s)}">${esc(s)}</button>`).join('')}</div></div>`;
    el.querySelectorAll('[data-s]').forEach((b) => b.onclick = () => { $('#q').value = b.dataset.s; send(); });
    return;
  }
  el.innerHTML = chatHistory.map((m) => `<div class="msg ${m.role === 'user' ? 'u' : 'a'}"><span class="who">${m.role === 'user' ? I('user') : BOLT}</span><div style="min-width:0"><div class="bub">${esc(m.content)}</div>${m.meta ? `<small>${I('cpu')}${esc(m.meta)}</small>` : ''}</div></div>`).join('');
  el.scrollTop = el.scrollHeight;
}
async function send() {
  const q = $('#q').value.trim();
  if (!q) return;
  $('#q').value = ''; $('#q').style.height = 'auto';
  chatHistory.push({ role: 'user', content: q });
  const a = { role: 'assistant', content: '…', meta: '' };
  chatHistory.push(a);
  renderChat();
  const t0 = performance.now();
  try {
    const r = await fetch('/v1/chat/completions', { method: 'POST', headers: { authorization: 'Bearer ' + KEY, 'content-type': 'application/json' },
      body: JSON.stringify({ model: $('#model').value, stream: true, messages: chatHistory.slice(0, -1).map(({ role, content }) => ({ role, content })) }) });
    if (!r.ok) { const j = await r.json().catch(() => ({})); throw new Error(j.error?.message || 'HTTP ' + r.status); }
    const prov = r.headers.get('x-free-llm-provider');
    const model = r.headers.get('x-free-llm-model');
    const tries = Number(r.headers.get('x-free-llm-attempts') || 1);
    const reader = r.body.getReader();
    const dec = new TextDecoder();
    let buf = '';
    a.content = '';
    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      let i;
      while ((i = buf.indexOf('\n\n')) >= 0) {
        const line = buf.slice(0, i).replace(/^data: /, '');
        buf = buf.slice(i + 2);
        if (line === '[DONE]') continue;
        try { const j = JSON.parse(line); const d = j.choices?.[0]?.delta?.content; if (d) { a.content += d; renderChat(); } if (j.error) throw new Error(j.error.message); } catch (e) { if (e.message && !e.message.startsWith('Unexpected')) throw e; }
      }
    }
    a.meta = `${prov}/${model} · ${ms(performance.now() - t0)}${tries > 1 ? ` · switched ${tries - 1}× before answering` : ''}`;
  } catch (e) {
    a.content = '⚠️ ' + e.message;
  }
  renderChat();
}

async function route() {
  const p = (location.hash || '#home').slice(1);
  document.querySelectorAll('nav a[data-p]').forEach((a) => a.classList.toggle('on', a.dataset.p === (pages[p] ? p : 'home')));
  clearInterval(timer);
  if (!KEY) return login();
  if (!STATUS) api('/admin/api/status').then((s) => { STATUS = s; navInfo(s); }).catch(() => {});
  try { await (pages[p] || pages.home)(); } catch (e) { if (e.message !== 'unauthorized') $('#main').innerHTML = `<div class="card cb"><h2>Something went wrong</h2><p class="muted">${esc(e.message)}</p><button class="btn mt" onclick="route()">${I('refresh')}Try again</button></div>`; }
}
addEventListener('hashchange', route);
