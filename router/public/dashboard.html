<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Free-LLM Router</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230ea5e9'/%3E%3Cpath d='M18 4 8 18h7l-2 10 11-15h-7z' fill='white'/%3E%3C/svg%3E">
<style>
:root{--bg:#f6f7fb;--panel:#fff;--panel2:#f1f4f9;--text:#0f172a;--muted:#64748b;--line:#e2e8f0;--brand:#0ea5e9;--brand2:#6366f1;--ok:#16a34a;--warn:#d97706;--bad:#dc2626;--chip:#eef2ff;--shadow:0 1px 2px rgba(15,23,42,.06),0 4px 16px rgba(15,23,42,.05);--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0b1020;--panel:#121a2e;--panel2:#18223a;--text:#e5e9f2;--muted:#94a3b8;--line:#243049;--chip:#1e2a48;--shadow:none}}
:root[data-theme=dark]{--bg:#0b1020;--panel:#121a2e;--panel2:#18223a;--text:#e5e9f2;--muted:#94a3b8;--line:#243049;--chip:#1e2a48;--shadow:none}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
a{color:var(--brand)}button,input,select,textarea{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}
nav{background:var(--panel);border-right:1px solid var(--line);padding:18px 12px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:17px;padding:4px 8px 16px}
.logo i{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--brand),var(--brand2));display:grid;place-items:center;color:#fff;font-style:normal}
nav a{display:flex;gap:10px;align-items:center;padding:9px 10px;border-radius:9px;color:var(--text);text-decoration:none;font-weight:550}
nav a:hover{background:var(--panel2)}nav a.on{background:var(--chip);color:var(--brand2)}
nav .sp{flex:1}nav small{color:var(--muted);padding:0 10px}
main{padding:28px clamp(16px,3vw,40px);max-width:1180px;width:100%;min-width:0}
h1{font-size:26px;margin:0 0 4px}h2{font-size:18px;margin:0 0 12px}.sub{color:var(--muted);margin:0 0 22px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:var(--shadow)}
.grid{display:grid;gap:14px}.g4{grid-template-columns:repeat(4,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:repeat(2,1fr)}
.kpi b{display:block;font-size:26px;letter-spacing:-.02em}.kpi span{color:var(--muted);font-size:13px}
.btn{text-decoration:none;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel);border-radius:9px;padding:8px 13px;cursor:pointer;font-weight:600}
.btn:hover{border-color:var(--brand)}.btn.p{background:var(--brand);border-color:var(--brand);color:#fff}.btn.p:hover{filter:brightness(1.07)}
.btn.s{padding:5px 10px;font-size:13px}.btn.d{color:var(--bad)}
input[type=text],input[type=password],input[type=number],select,textarea{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:8px 11px;width:100%}
textarea{font-family:var(--mono);font-size:13px}
input:focus,select:focus,textarea:focus{outline:2px solid color-mix(in srgb,var(--brand) 40%,transparent);border-color:var(--brand)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.row>*{min-width:0}.grow{flex:1}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;padding:2px 9px;border-radius:99px;background:var(--chip);color:var(--muted);font-weight:600;white-space:nowrap}
.chip.ok{background:color-mix(in srgb,var(--ok) 14%,transparent);color:var(--ok)}.chip.warn{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn)}.chip.bad{background:color-mix(in srgb,var(--bad) 14%,transparent);color:var(--bad)}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;background:var(--muted)}.dot.ok{background:var(--ok)}.dot.warn{background:var(--warn)}.dot.bad{background:var(--bad)}
table{width:100%;border-collapse:collapse;font-size:14px}th{text-align:left;color:var(--muted);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.04em;padding:8px;border-bottom:1px solid var(--line)}
td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:middle}tr:last-child td{border-bottom:0}
.tw{overflow-x:auto}
code,.mono{font-family:var(--mono);font-size:13px}
pre{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:12px;overflow:auto;font-size:12.5px;margin:0;white-space:pre-wrap;word-break:break-word}
.copy{position:relative}.copy .btn{position:absolute;top:8px;right:8px}
.banner{border-radius:14px;padding:18px 20px;background:linear-gradient(135deg,color-mix(in srgb,var(--brand) 14%,var(--panel)),color-mix(in srgb,var(--brand2) 12%,var(--panel)));border:1px solid var(--line);margin-bottom:18px}
  .trust{border-radius:14px;padding:16px 18px;margin-bottom:14px;border:1px solid color-mix(in srgb,var(--ok) 35%,var(--line));background:color-mix(in srgb,var(--ok) 9%,var(--panel))}
.trust h2{margin:0 0 8px;color:var(--ok)}.trust ul{margin:0;padding-left:20px}.trust li{margin:3px 0}.trust small{color:var(--muted)}
.banner.warn{background:color-mix(in srgb,var(--warn) 12%,var(--panel))}
.flow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:6px 0}.flow div{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-weight:600}.flow span{color:var(--muted)}
.bar{height:6px;border-radius:9px;background:var(--panel2);overflow:hidden;min-width:60px}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--brand),var(--brand2))}
.prov{display:grid;grid-template-columns:1fr auto;gap:10px;padding:14px 0;border-bottom:1px solid var(--line)}.prov:last-child{border:0}
.prov h3{margin:0;font-size:15px}.prov p{margin:2px 0 0;color:var(--muted);font-size:13px}
.keyrow{display:flex;gap:8px;margin-top:8px}.keyrow input{flex:1}
.msg{white-space:pre-wrap;padding:10px 13px;border-radius:12px;margin:8px 0;max-width:85%}.msg.u{background:var(--brand);color:#fff;margin-left:auto}.msg.a{background:var(--panel2)}
.msg small{display:block;color:var(--muted);font-size:11px;margin-top:6px}
.chat{height:52vh;overflow:auto;padding:4px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;opacity:0;transition:.25s;pointer-events:none;z-index:9}.toast.on{opacity:1}
.opt{border:1px solid var(--line);border-radius:12px;padding:12px;cursor:pointer;display:block}.opt:has(input:checked){border-color:var(--brand);background:var(--chip)}.opt input{margin-right:6px}.opt p{margin:4px 0 0;color:var(--muted);font-size:13px}
.svgchart{width:100%;height:140px}.muted{color:var(--muted)}.hide{display:none!important}
.steps{counter-reset:s;display:grid;gap:10px;margin:0;padding:0;list-style:none}.steps li{counter-increment:s;display:flex;gap:10px}.steps li:before{content:counter(s);width:24px;height:24px;flex:none;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;font-size:13px;font-weight:700}
@media (max-width:900px){.app{grid-template-columns:minmax(0,1fr)}nav{position:static;height:auto;flex-direction:row;overflow-x:auto;padding:10px;border-right:0;border-bottom:1px solid var(--line)}nav .logo,nav .sp,nav small{display:none}nav a{white-space:nowrap}.g4{grid-template-columns:repeat(2,1fr)}.g3,.g2{grid-template-columns:1fr}.prov{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app">
<nav>
  <div class="logo"><i>⚡</i> Free-LLM Router</div>
  <a href="#home" data-p="home">🏠 Home</a>
  <a href="#keys" data-p="keys">🔑 Free keys</a>
  <a href="#connect" data-p="connect">🔌 Connect your tools</a>
  <a href="#playground" data-p="playground">💬 Try it</a>
  <a href="#models" data-p="models">🧠 Models</a>
  <a href="#activity" data-p="activity">📈 Activity</a>
  <a href="#settings" data-p="settings">⚙️ Settings</a>
  <div class="sp"></div>
  <a href="https://free-llm.com" target="_blank" rel="noopener">🌐 free-llm.com</a>
  <a href="#" id="theme">🌓 Theme</a>
  <small id="ver"></small>
</nav>
<main id="main"></main>
</div>
<div class="toast" id="toast"></div>

<script>
window.BOOT = __BOOT__;
const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmt = (n) => Number(n || 0).toLocaleString();
const ms = (v) => v == null ? '—' : v < 1000 ? Math.round(v) + ' ms' : (v / 1000).toFixed(1) + ' s';
const ago = (t) => { const s = Math.round((Date.now() - new Date(t).getTime()) / 1000); return s < 60 ? s + 's ago' : s < 3600 ? Math.round(s / 60) + ' min ago' : Math.round(s / 3600) + ' h ago'; };
let KEY = BOOT.key;
try { KEY = KEY || localStorage.getItem('fllm_key'); } catch {}
$('#ver').textContent = 'v' + BOOT.version;

function toast(t) { const el = $('#toast'); el.textContent = t; el.classList.add('on'); clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove('on'), 2200); }
async function api(path, opts = {}) {
  const r = await fetch(path, { ...opts, headers: { authorization: 'Bearer ' + KEY, 'content-type': 'application/json', ...(opts.headers || {}) }, body: opts.body ? JSON.stringify(opts.body) : undefined });
  if (r.status === 401) { login(); throw new Error('unauthorized'); }
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error?.message || j.error || 'HTTP ' + r.status);
  return j;
}
function copyText(t) { navigator.clipboard?.writeText(t).then(() => toast('Copied ✓'), () => toast('Select and copy manually')); }
document.addEventListener('click', (e) => {
  const c = e.target.closest('[data-copy]');
  if (c) { e.preventDefault(); copyText(c.dataset.copy); }
});

// theme
(function () {
  let t = null; try { t = localStorage.getItem('fllm_theme'); } catch {}
  if (t) document.documentElement.dataset.theme = t;
  $('#theme').onclick = (e) => {
    e.preventDefault();
    const cur = document.documentElement.dataset.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    const next = cur === 'dark' ? 'light' : 'dark';
    document.documentElement.dataset.theme = next;
    try { localStorage.setItem('fllm_theme', next); } catch {}
  };
})();

function login() {
  $('#main').innerHTML = `<h1>Unlock the dashboard</h1><p class="sub">Paste your router key. It is printed when the router starts, and stored in <code>~/.free-llm/config.json</code>.</p>
  <div class="card row"><input type="password" id="k" class="grow" placeholder="fllm-…"><button class="btn p" id="go">Open</button></div>`;
  $('#go').onclick = () => { KEY = $('#k').value.trim(); try { localStorage.setItem('fllm_key', KEY); } catch {} route(); };
}

// ---------------- pages ----------------
const pages = {};
let STATUS = null;
let timer = null;

pages.home = async () => {
  const [s, stats] = await Promise.all([api('/admin/api/status'), api('/admin/api/stats?days=7')]);
  STATUS = s;
  const t = s.today;
  const rate = t.requests ? Math.round((t.ok / t.requests) * 100) : null;
  const banner = s.guest_mode || !s.providers_with_keys ? `
    <div class="banner warn"><h2 style="margin:0 0 6px">${s.guest_mode ? "You're in guest mode 👋" : 'One step left: add a free key 🔑'}</h2>
    <p style="margin:0 0 12px">${s.guest_mode ? 'The router already answers with a few no-account free models, but they are slow and limited.' : 'The router is running, but it needs at least one provider key before it can answer.'}
    <b>Add 2–3 free keys</b> (1 minute each, most without a credit card — they stay on this computer) and you get dozens of fast, strong models — enough for coding agents like Claude Code.</p>
    <a class="btn p" href="#keys">🔑 Add my first free key</a></div>` : '';
  $('#main').innerHTML = `
    <h1>Your free AI gateway is running</h1>
    <p class="sub">One address for all the free AI models. Point any app at it — the router does the rest.</p>
    ${banner}
    <p class="muted" style="margin:-8px 0 16px;font-size:13px">🔒 Everything runs on this computer. Your keys and your conversations never go through free-llm.com — requests go straight from here to each provider. <a href="#keys">How your keys are protected</a></p>
    <div class="grid g4" style="margin-bottom:14px">
      <div class="card kpi"><b>${fmt(s.models)}</b><span>free models ready</span></div>
      <div class="card kpi"><b>${fmt(s.providers_with_keys)}</b><span>providers with your keys</span></div>
      <div class="card kpi"><b>${fmt(t.requests)}</b><span>requests today${rate != null ? ` · ${rate}% first-try` : ''}</span></div>
      <div class="card kpi"><b>${fmt(t.tokens)}</b><span>free tokens used today</span></div>
    </div>
    <div class="grid g2">
      <div class="card">
        <h2>How it works</h2>
        <div class="flow"><div>Your app or agent</div><span>→</span><div style="border-color:var(--brand)">⚡ Router</div><span>→</span><div>Gemini · Groq · OpenRouter · NVIDIA · …</div></div>
        <ol class="steps" style="margin-top:14px">
          <li><span>Your app sends a normal OpenAI- or Anthropic-style request to <b>one</b> address.</span></li>
          <li><span>The router picks the best free model that is up right now (speed, quality, quota left).</span></li>
          <li><span>If that provider is busy, slow or out of quota, it switches to the next one <b>instantly</b> — your app never sees the error.</span></li>
        </ol>
        <p class="muted" style="margin:12px 0 0;font-size:13px">The list of free providers and models updates itself every few hours from <a href="https://free-llm.com" target="_blank" rel="noopener">free-llm.com</a> — same day, no paywall.</p>
      </div>
      <div class="card">
        <h2>Your connection details</h2>
        <p class="muted" style="margin-top:-6px">Use these in any app that accepts an OpenAI-compatible API.</p>
        <label class="muted" style="font-size:13px">Base URL</label>
        <div class="row" style="margin-bottom:10px"><code class="grow">${esc(s.base_url)}</code><button class="btn s" data-copy="${esc(s.base_url)}">Copy</button></div>
        <label class="muted" style="font-size:13px">API key</label>
        <div class="row" style="margin-bottom:10px"><code class="grow" style="word-break:break-all">${esc(s.api_key)}</code><button class="btn s" data-copy="${esc(s.api_key)}">Copy</button></div>
        <label class="muted" style="font-size:13px">Model</label>
        <div class="row"><code class="grow">auto</code><span class="muted" style="font-size:13px">or auto:coding · auto:fast · auto:smart</span></div>
        <div class="row" style="margin-top:14px"><a class="btn p" href="#connect">🔌 Connect Claude Code, Codex, Cursor…</a><a class="btn" href="#playground">💬 Try it</a></div>
      </div>
    </div>
    <div class="card" style="margin-top:14px"><h2>Last 7 days</h2>${chart(stats.days)}</div>
    <p class="muted" style="font-size:13px;margin-top:14px">Catalog: ${fmt(s.catalog.providers)} providers · ${fmt(s.catalog.models)} models · from ${esc(s.catalog.source)} · loaded ${s.catalog.loaded_at ? ago(s.catalog.loaded_at) : '—'}</p>`;
};

function chart(raw) {
  // always 7 slots, oldest → today
  const byDay = Object.fromEntries(raw.map((d) => [d.day, d]));
  const days = Array.from({ length: 7 }, (_, i) => {
    const k = new Date(Date.now() - (6 - i) * 864e5).toISOString().slice(0, 10);
    return byDay[k] || { day: k, requests: 0, fail: 0 };
  });
  if (!days.some((d) => d.requests)) return '<p class="muted">No requests yet. Send one from “Try it” or connect a tool.</p>';
  const max = Math.max(...days.map((d) => d.requests), 1);
  const w = 100 / days.length;
  const bars = days.map((d, i) => {
    const h = (d.requests / max) * 100;
    const hf = (d.fail / max) * 100;
    return `<g><title>${esc(d.day)}: ${d.requests} requests (${d.fail} retried)</title>
      <rect x="${i * w + w * 0.18}%" y="${100 - h}%" width="${w * 0.64}%" height="${h}%" rx="3" fill="var(--brand)"></rect>
      <rect x="${i * w + w * 0.18}%" y="${100 - hf}%" width="${w * 0.64}%" height="${hf}%" rx="3" fill="var(--warn)"></rect></g>`;
  }).join('');
  const labels = days.map((d, i) => `<span style="width:${w}%;text-align:center">${esc(d.day.slice(5))}</span>`).join('');
  return `<svg class="svgchart" preserveAspectRatio="none">${bars}</svg><div class="row muted" style="gap:0;font-size:12px">${labels}</div>
    <p class="muted" style="font-size:12px;margin:6px 0 0"><span class="dot" style="background:var(--brand)"></span> requests &nbsp; <span class="dot warn"></span> switched to another provider</p>`;
}

const TRUST = `<div class="trust"><h2>🔒 100% local — your keys never leave this computer</h2><ul>
  <li><b>Stored only here</b>, encrypted (AES-256-GCM) in <code>~/.free-llm</code>. Not on free-llm.com, not in any cloud, no account.</li>
  <li><b>Each key goes only to its own provider</b> (e.g. your Groq key only to <code>api.groq.com</code>) — and is locked to that address: if it ever changed, the router would refuse to send it.</li>
  <li><b>No telemetry, no analytics, no tracking.</b> The only other thing the router downloads is the public list of free models — it sends nothing about you.</li>
  <li><b>Open source</b>: every line is on <a href="https://github.com/nejib1/Free-LLM/tree/main/router" target="_blank" rel="noopener">GitHub</a> — anyone can check.</li></ul></div>`;
const SIGNUP = { no: ['ok', 'No card'], registration: ['', 'Email sign-up'], phone_verification: ['warn', 'Phone check'], credit_card: ['bad', 'Card required'] };
let provFilter = '';
let showAll = false;
pages.keys = async () => {
  const { providers } = await api('/admin/api/providers');
  const usable = providers.filter((p) => p.usable && p.chat_models > 0);
  usable.sort((a, b) => (b.keys.length > 0) - (a.keys.length > 0) || b.score - a.score);
  const mine = usable.filter((p) => p.keys.length);
  const list = usable.filter((p) => (!provFilter || (p.name + p.slug).toLowerCase().includes(provFilter)));
  const shown = showAll || provFilter ? list : list.slice(0, Math.max(14, mine.length + 8));
  $('#main').innerHTML = `
    <h1>Free API keys</h1>
    <p class="sub">Each key unlocks more free models. Click <b>Get a free key</b>, sign up (usually 1 minute), paste the key here — it is tested right away and stored encrypted on <b>this computer only</b>.</p>
    ${TRUST}
    <div class="card" style="margin-bottom:14px"><div class="row"><input type="text" id="pf" class="grow" placeholder="Search a provider (Gemini, Groq, OpenRouter…)" value="${esc(provFilter)}">
      <span class="chip ok">${mine.length} connected</span><span class="chip">${usable.length} available</span></div></div>
    <div class="card">${shown.map(provRow).join('')}
    ${shown.length < list.length ? `<div style="text-align:center;padding-top:12px"><button class="btn" id="more">Show all ${list.length} providers</button></div>` : ''}</div>`;
  $('#pf').oninput = (e) => { provFilter = e.target.value.toLowerCase(); clearTimeout(window._pf); window._pf = setTimeout(() => pages.keys().then(() => { const i = $('#pf'); i.focus(); i.setSelectionRange(i.value.length, i.value.length); }), 250); };
  if ($('#more')) $('#more').onclick = () => { showAll = true; pages.keys(); };
  document.querySelectorAll('[data-add]').forEach((b) => b.onclick = () => addKey(b.dataset.add));
  document.querySelectorAll('[data-del]').forEach((b) => b.onclick = async () => { if (!confirm('Remove this key?')) return; await api('/admin/api/keys', { method: 'DELETE', body: { provider: b.dataset.p, id: b.dataset.del } }); toast('Removed'); pages.keys(); });
  document.querySelectorAll('[data-test]').forEach((b) => b.onclick = async () => { b.textContent = 'Testing…'; const r = await api('/admin/api/keys/test', { method: 'POST', body: { provider: b.dataset.test } }); toast(r.results.every((x) => x.ok) ? 'Works ✓' : 'Problem: ' + (r.results.find((x) => !x.ok)?.error || '')); pages.keys(); });
  document.querySelectorAll('[data-guest]').forEach((b) => b.onclick = async () => { await api('/admin/api/providers/toggle', { method: 'POST', body: { provider: b.dataset.guest, guest: b.dataset.on !== '1' } }); pages.keys(); });
};
function provRow(p) {
  const [cls, label] = SIGNUP[p.signup] || ['', p.signup || ''];
  const keys = p.keys.map((k) => `<div class="row" style="margin-top:6px;font-size:13px"><span class="dot ${k.invalid ? 'bad' : 'ok'}"></span><code>${esc(k.masked)}</code>
    ${k.invalid ? `<span class="chip bad">${esc(k.invalid)}</span>` : `<span class="chip ok">active · only sent to ${esc(k.sent_to || '')}</span>`}
    ${k.rate?.remaining_requests != null ? `<span class="muted">${fmt(k.rate.remaining_requests)} requests left in window</span>` : ''}
    <button class="btn s d" data-p="${esc(p.slug)}" data-del="${esc(k.id)}">Remove</button></div>`).join('');
  return `<div class="prov"><div>
    <h3>${esc(p.name)} <span class="chip ${cls}">${esc(label)}</span> ${p.category === 'trial_credit' ? '<span class="chip">trial credit</span>' : ''} ${p.guest ? '<span class="chip">works without key</span>' : ''}</h3>
    <p>${p.chat_models} free models${p.rate_limit ? ' · ' + esc(String(p.rate_limit).slice(0, 110)) : ''}</p>
    ${keys}
    ${p.needs.includes('account_id') ? `<div class="keyrow"><input type="text" id="acc-${esc(p.slug)}" placeholder="Account ID${p.has_account_id ? ' (saved)' : ''}"></div>` : ''}
    <div class="keyrow"><input type="password" id="key-${esc(p.slug)}" placeholder="Paste your ${esc(p.name)} API key" autocomplete="off"><button class="btn p" data-add="${esc(p.slug)}">Add</button></div>
    <p style="margin-top:6px;font-size:12px">🔒 Stays on this computer, encrypted · sent only to <code>${esc(p.sends_to || 'the provider')}</code></p>
    </div><div class="row" style="align-content:start;justify-content:flex-end">
    <a class="btn" href="${esc(p.help_url)}" target="_blank" rel="noopener">Get a free key ↗</a>
    ${p.keys.length ? `<button class="btn s" data-test="${esc(p.slug)}">Test</button>` : ''}
    ${p.guest ? `<button class="btn s" data-guest="${esc(p.slug)}" data-on="${p.guest_enabled ? '1' : ''}">${p.guest_enabled ? 'Disable guest use' : 'Enable guest use'}</button>` : ''}
    </div></div>`;
}
async function addKey(slug) {
  const key = $('#key-' + CSS.escape(slug)).value.trim();
  const acc = $('#acc-' + CSS.escape(slug))?.value.trim();
  if (!key && !acc) return toast('Paste the key first');
  toast('Saving and testing…');
  try {
    const r = await api('/admin/api/keys', { method: 'POST', body: { provider: slug, key, account_id: acc || undefined } });
    toast(!r.test ? 'Saved' : r.test.ok ? `Works ✓ (${ms(r.test.ms)}) — models unlocked` : 'Saved, but the test failed: ' + r.test.error);
  } catch (e) { toast(e.message); }
  pages.keys();
}

let chatHistory = [];
pages.playground = async () => {
  const models = await api('/v1/models');
  const opts = models.data.map((m) => `<option value="${esc(m.id)}">${esc(m.id)}${m.description ? ' — ' + esc(m.description) : ''}</option>`).join('');
  $('#main').innerHTML = `
    <h1>Try it</h1>
    <p class="sub">Chat through the router. Each answer shows which free model replied — and whether the router had to switch.</p>
    <div class="card">
      <div class="row" style="margin-bottom:10px"><select id="model" class="grow">${opts}</select><button class="btn" id="clear">New chat</button></div>
      <div class="chat" id="chat">${chatHistory.length ? '' : '<p class="muted">Ask anything. Tip: pick <code>auto:fusion</code> to get an answer merged from three different models.</p>'}</div>
      <div class="row" style="margin-top:10px"><textarea id="q" rows="2" class="grow" placeholder="Type a message… (Enter to send, Shift+Enter for a new line)" style="font-family:inherit;font-size:15px"></textarea><button class="btn p" id="send">Send</button></div>
    </div>`;
  renderChat();
  $('#clear').onclick = () => { chatHistory = []; renderChat(); };
  $('#send').onclick = send;
  $('#q').onkeydown = (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); } };
};
function renderChat() {
  const el = $('#chat');
  if (!el) return;
  if (!chatHistory.length) return;
  el.innerHTML = chatHistory.map((m) => `<div class="msg ${m.role === 'user' ? 'u' : 'a'}">${esc(m.content)}${m.meta ? `<small>${esc(m.meta)}</small>` : ''}</div>`).join('');
  el.scrollTop = el.scrollHeight;
}
async function send() {
  const q = $('#q').value.trim();
  if (!q) return;
  $('#q').value = '';
  chatHistory.push({ role: 'user', content: q });
  const a = { role: 'assistant', content: '…', meta: '' };
  chatHistory.push(a);
  renderChat();
  const t0 = performance.now();
  try {
    const r = await fetch('/v1/chat/completions', { method: 'POST', headers: { authorization: 'Bearer ' + KEY, 'content-type': 'application/json' },
      body: JSON.stringify({ model: $('#model').value, stream: true, messages: chatHistory.slice(0, -1).map(({ role, content }) => ({ role, content })) }) });
    if (!r.ok) { const j = await r.json().catch(() => ({})); throw new Error(j.error?.message || 'HTTP ' + r.status); }
    const prov = r.headers.get('x-free-llm-provider');
    const model = r.headers.get('x-free-llm-model');
    const tries = Number(r.headers.get('x-free-llm-attempts') || 1);
    const reader = r.body.getReader();
    const dec = new TextDecoder();
    let buf = '';
    a.content = '';
    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      let i;
      while ((i = buf.indexOf('\n\n')) >= 0) {
        const line = buf.slice(0, i).replace(/^data: /, '');
        buf = buf.slice(i + 2);
        if (line === '[DONE]') continue;
        try { const j = JSON.parse(line); const d = j.choices?.[0]?.delta?.content; if (d) { a.content += d; renderChat(); } if (j.error) throw new Error(j.error.message); } catch (e) { if (e.message && !e.message.startsWith('Unexpected')) throw e; }
      }
    }
    a.meta = `${prov}/${model} · ${ms(performance.now() - t0)}${tries > 1 ? ` · switched ${tries - 1}× before answering` : ''}`;
  } catch (e) {
    a.content = '⚠️ ' + e.message;
  }
  renderChat();
}

let modelFilter = '';
pages.models = async () => {
  const { models } = await api('/admin/api/models');
  const list = models.filter((m) => !modelFilter || (m.id + m.name).toLowerCase().includes(modelFilter));
  $('#main').innerHTML = `
    <h1>Models</h1>
    <p class="sub">Every free model you can use right now, best first. The router measures speed and reliability as you use them. Switch a model off if you never want it.</p>
    <div class="card" style="margin-bottom:14px"><div class="row"><input type="text" id="mf" class="grow" placeholder="Filter (deepseek, qwen, gemini…)" value="${esc(modelFilter)}">
      <span class="chip ok">${models.filter((m) => m.status === 'ok').length} ready</span><span class="chip">${models.length} total</span>
      <button class="btn s" id="reset">Clear all cooldowns</button></div></div>
    <div class="card tw"><table><thead><tr><th></th><th>Model</th><th>Provider</th><th>Capability</th><th>Context</th><th>Speed</th><th>Success</th><th></th></tr></thead><tbody>
    ${list.map((m) => {
      const ok = m.status === 'ok';
      const h = m.health || {};
      return `<tr><td><span class="dot ${ok ? 'ok' : m.disabled ? '' : 'warn'}" title="${esc(m.status)}"></span></td>
        <td><b>${esc(m.name)}</b><div class="muted mono" style="font-size:12px">${esc(m.provider)}/${esc(m.model)}</div>${!ok ? `<div class="muted" style="font-size:12px">${esc(m.status)}</div>` : ''}</td>
        <td>${esc(m.provider_name)}${m.guest ? ' <span class="chip">guest</span>' : ''}</td>
        <td><div class="bar" title="${m.quality}/100"><i style="width:${m.quality}%"></i></div>${m.vision ? '<span class="chip">👁 images</span>' : ''}${m.reasoning ? '<span class="chip">🧩 reasoning</span>' : ''}</td>
        <td>${!m.ctx ? '—' : m.ctx >= 1e6 ? +(m.ctx / 1e6).toFixed(1) + 'M' : Math.round(m.ctx / 1000) + 'K'}</td>
        <td>${ms(h.ttft ?? h.latency)}</td>
        <td>${h.uses ? Math.round(h.reliability * 100) + '%' : '<span class="muted">new</span>'}</td>
        <td><button class="btn s" data-tog="${esc(m.provider)}|${esc(m.model)}" data-en="${m.disabled ? '1' : ''}">${m.disabled ? 'Enable' : 'Off'}</button></td></tr>`;
    }).join('')}</tbody></table>${!list.length ? '<p class="muted">No models yet — add a free key first.</p>' : ''}</div>`;
  $('#mf').oninput = (e) => { modelFilter = e.target.value.toLowerCase(); clearTimeout(window._mf); window._mf = setTimeout(() => pages.models().then(() => { const i = $('#mf'); i.focus(); i.setSelectionRange(i.value.length, i.value.length); }), 250); };
  $('#reset').onclick = async () => { await api('/admin/api/reset-cooldowns', { method: 'POST', body: {} }); toast('Cooldowns cleared'); pages.models(); };
  document.querySelectorAll('[data-tog]').forEach((b) => b.onclick = async () => {
    const [provider, ...rest] = b.dataset.tog.split('|');
    await api('/admin/api/models/toggle', { method: 'POST', body: { provider, model: rest.join('|'), enabled: b.dataset.en === '1' } });
    pages.models();
  });
};

pages.activity = async () => {
  const [{ requests }, stats] = await Promise.all([api('/admin/api/logs?n=150'), api('/admin/api/stats?days=7')]);
  $('#main').innerHTML = `
    <h1>Activity</h1>
    <p class="sub">Live log of the last requests. “Switches” shows when the router silently moved to another free model for you.</p>
    <div class="card tw" style="margin-bottom:14px"><h2>Most used models (7 days)</h2><table><thead><tr><th>Model</th><th>Requests</th><th>OK</th><th>Median</th><th>p95</th><th>Tokens</th></tr></thead><tbody>
      ${stats.models.slice(0, 12).map((m) => `<tr><td class="mono">${esc(m.id)}</td><td>${fmt(m.requests)}</td><td>${m.requests ? Math.round((m.ok / m.requests) * 100) : 0}%</td><td>${ms(m.p50)}</td><td>${ms(m.p95)}</td><td>${fmt(m.tokens_in + m.tokens_out)}</td></tr>`).join('') || '<tr><td colspan="6" class="muted">Nothing yet.</td></tr>'}
    </tbody></table></div>
    <div class="card tw"><h2>Recent requests</h2><table><thead><tr><th>When</th><th>From</th><th>Asked for</th><th>Answered by</th><th>Switches</th><th>Time</th><th>Tokens</th></tr></thead><tbody>
      ${requests.map((r) => {
        const fails = (r.attempts || []).filter((a) => !a.ok);
        return `<tr><td>${ago(r.ts)}</td><td><span class="chip">${esc(r.endpoint)}</span><div class="muted" style="font-size:11px">${esc((r.client || '').slice(0, 28))}</div></td><td class="mono">${esc(r.requested)}</td>
          <td>${r.status === 200 ? `<span class="dot ok"></span> <span class="mono">${esc(r.served || '')}</span>${r.cached ? ' <span class="chip">cache</span>' : ''}` : `<span class="dot bad"></span> ${esc((r.error || '').slice(0, 120))}`}</td>
          <td title="${esc(fails.map((a) => a.target + ' → ' + a.kind).join('\n'))}">${fails.length ? `<span class="chip warn">${fails.length}</span>` : '0'}</td>
          <td>${ms(r.ms)}</td><td>${fmt((r.tokens_in || 0) + (r.tokens_out || 0))}</td></tr>`;
      }).join('') || '<tr><td colspan="7" class="muted">No requests yet.</td></tr>'}
    </tbody></table></div>`;
  clearInterval(timer);
  timer = setInterval(() => { if (location.hash === '#activity' && !document.hidden) pages.activity(); }, 5000);
};

const STRAT = {
  balanced: ['Balanced (recommended)', 'Strong models that are also fast. Good for everything.'],
  smart: ['Smartest first', 'Always try the most capable models first, even if slower.'],
  fast: ['Fastest first', 'Lowest response time first — great for autocomplete and chat.'],
  spread: ['Spread the load', 'Rotate across providers so no free quota runs out.'],
  order: ['My order', 'Use exactly the order you set in “Preferred models”.'],
};
pages.settings = async () => {
  const s = await api('/admin/api/settings');
  $('#main').innerHTML = `
    <h1>Settings</h1><p class="sub">The defaults are good. Change things only if you want to.</p>
    <div class="card" style="margin-bottom:14px"><h2>How should the router choose?</h2>
      <div class="grid g3">${Object.entries(STRAT).map(([k, [t, d]]) => `<label class="opt"><input type="radio" name="strategy" value="${k}" ${s.strategy === k ? 'checked' : ''}><b>${t}</b><p>${d}</p></label>`).join('')}</div>
      <p class="muted" style="font-size:13px;margin:10px 0 0">Apps can also ask per request with the model name: <code>auto:coding</code>, <code>auto:fast</code>, <code>auto:smart</code>, <code>auto:long</code>, <code>auto:vision</code>, <code>auto:reasoning</code>, <code>auto:spread</code>, <code>auto:fusion</code>.</p></div>
    <div class="grid g2">
      <div class="card"><h2>Behaviour</h2>
        <label class="row"><input type="checkbox" id="fallback" ${s.fallback_to_auto ? 'checked' : ''}> If the exact model asked for is unavailable, use another free model</label>
        <label class="row"><input type="checkbox" id="think" ${s.strip_think_tags ? 'checked' : ''}> Hide &lt;think&gt; reasoning from answers</label>
        <label class="row"><input type="checkbox" id="cache" ${s.cache?.enabled ? 'checked' : ''}> Cache identical requests (saves quota)</label>
        <label class="row"><input type="checkbox" id="logs" ${s.log_requests ? 'checked' : ''}> Keep a request log on disk</label>
        <label class="row"><input type="checkbox" id="ollama" ${s.ollama?.enabled !== false ? 'checked' : ''}> Ollama-compatible API (for Zed, JetBrains, Open WebUI)</label>
        <label class="row"><input type="checkbox" id="mcp" ${s.mcp?.enabled !== false ? 'checked' : ''}> MCP server at /mcp</label>
        <div class="row" style="margin-top:10px"><span class="grow">Keep a conversation on the same model for (minutes)</span><input type="number" id="sticky" value="${s.sticky_minutes}" style="width:90px"></div>
        <div class="row" style="margin-top:8px"><span class="grow">Max providers tried per request</span><input type="number" id="attempts" value="${s.max_attempts}" style="width:90px"></div>
        <div class="row" style="margin-top:8px"><span class="grow">Give up on a silent provider after (seconds)</span><input type="number" id="ftt" value="${s.first_token_timeout_s}" style="width:90px"></div>
      </div>
      <div class="card"><h2>Preferred models</h2>
        <p class="muted" style="margin-top:-6px;font-size:13px">One per line, as <code>provider/model</code> (see Models). They are tried first; with “My order” they are tried in exactly this order.</p>
        <textarea id="chain" rows="7" placeholder="groq-cloud/openai/gpt-oss-120b&#10;google-ai-studio/gemini-3-flash-preview">${esc((s.chain || []).join('\n'))}</textarea>
        <h2 style="margin-top:14px">Model name mapping</h2>
        <p class="muted" style="margin-top:-6px;font-size:13px">What to use when a tool asks for a model name the router doesn't know (e.g. Claude Code asking for “claude-sonnet”).</p>
        <textarea id="aliases" rows="6">${esc(JSON.stringify(s.aliases, null, 2))}</textarea>
      </div>
    </div>
    <div class="row" style="margin:14px 0"><button class="btn p" id="save">Save settings</button></div>
    <div class="card"><h2>Maintenance</h2><div class="row">
      <button class="btn" id="refresh">Update model catalog now</button>
      <button class="btn" id="rotate">Generate a new router key</button>
      <span class="muted" style="font-size:13px">Address: ${esc(s.host)}:${esc(s.port)} — change with <code>free-llm start --host 0.0.0.0 --port 4000</code> to share on your network.</span></div></div>`;
  $('#save').onclick = async () => {
    let aliases;
    try { aliases = JSON.parse($('#aliases').value); } catch { return toast('Model name mapping is not valid JSON'); }
    const body = {
      strategy: document.querySelector('input[name=strategy]:checked')?.value, fallback_to_auto: $('#fallback').checked, strip_think_tags: $('#think').checked,
      log_requests: $('#logs').checked, cache: { enabled: $('#cache').checked }, ollama: { enabled: $('#ollama').checked }, mcp: { enabled: $('#mcp').checked },
      sticky_minutes: Number($('#sticky').value), max_attempts: Number($('#attempts').value), first_token_timeout_s: Number($('#ftt').value),
      chain: $('#chain').value.split('\n').map((x) => x.trim()).filter(Boolean), aliases,
    };
    await api('/admin/api/settings', { method: 'POST', body });
    toast('Saved ✓');
  };
  $('#refresh').onclick = async () => { const r = await api('/admin/api/catalog/refresh', { method: 'POST', body: {} }); toast(`Catalog: ${r.catalog.providers} providers, ${r.catalog.models} models`); };
  $('#rotate').onclick = async () => {
    if (!confirm('Generate a new key? Every tool using the old one must be updated (free-llm setup … again).')) return;
    const r = await api('/admin/api/api-key/rotate', { method: 'POST', body: {} });
    KEY = r.api_key; try { localStorage.setItem('fllm_key', KEY); } catch {}
    toast('New key created');
  };
};

async function route() {
  const p = (location.hash || '#home').slice(1);
  document.querySelectorAll('nav a[data-p]').forEach((a) => a.classList.toggle('on', a.dataset.p === p));
  clearInterval(timer);
  if (!KEY) return login();
  try { await (pages[p] || pages.home)(); } catch (e) { if (e.message !== 'unauthorized') $('#main').innerHTML = `<div class="card"><h2>Something went wrong</h2><p>${esc(e.message)}</p></div>`; }
}
addEventListener('hashchange', route);
route();
</script>
